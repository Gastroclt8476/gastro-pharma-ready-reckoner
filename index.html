<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastro Pharma">
<link rel="manifest" href="./manifest.webmanifest">
<title>Gastro Pharma Ready Reckoner</title>
<style>
:root{--blue:#0b5cab;--bg:#f4f7fb;--card:#fff;--text:#17212b;--muted:#637080;--border:#d6e0ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.97);backdrop-filter:blur(12px);padding:14px 10px 10px;border-bottom:1px solid var(--border)}
h1{font-size:21px;margin:0 0 10px;font-weight:750}
.search{width:100%;font-size:17px;padding:14px 16px;border:1px solid #cbd5df;border-radius:14px;background:white;outline:none}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,171,.12)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--border);background:white;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:920px;margin:auto;padding:14px 10px 40px}
.count{color:var(--muted);font-size:14px;margin:4px 4px 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.brand{font-size:20px;font-weight:800;color:#075fac;margin-bottom:5px}
.company{font-size:14px;color:var(--muted);margin-bottom:10px}
.label{font-weight:750;margin-top:7px}
.value{margin-top:3px;line-height:1.4}
.page{display:inline-block;margin-top:10px;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.error{background:#fff1f1;border:1px solid #f0b5b5;border-radius:12px;padding:14px;color:#8a1c1c}
@media(min-width:700px){header{padding-left:max(10px,calc((100% - 900px)/2));padding-right:max(10px,calc((100% - 900px)/2))}h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <h1>Gastro Pharma Ready Reckoner</h1>
  <input id="search" class="search" type="search"
    placeholder="Search brand, product, generic, composition, company, indication…" autocomplete="off">
  <div id="filters" class="filters"></div>
</header>

<main>
  <div id="count" class="count">Loading products…</div>
  <div id="results"></div>
</main>

<script>
const CATEGORY_RULES = {
  GERD: /gerd|reflux|dyspepsia|gastritis|acid|ppi|proton pump/i,
  IBD: /ibd|ulcerative colitis|crohn|mesalamine|mesalazine|inflammatory bowel/i,
  IBS: /ibs|irritable bowel|functional bowel/i,
  Liver: /liver|hepatic|cirrhosis|nafld|masld|hepatitis|encephalopathy/i,
  Pancreas: /pancreas|pancreatic|pancreatitis/i,
  Constipation: /constipation|laxative|stool|ispaghula|lactitol|lactulose/i,
  "H. pylori": /h\.?\s*pylori|helicobacter/i,
  Diarrhea: /diarrhea|diarrhoea|loose stool|ors|oral rehydration/i,
  Nutrition: /nutrition|protein|vitamin|omega|micronutrient|supplement/i,
  Prokinetic: /prokinetic|domperidone|levosulpiride|itopride|mosapride|metoclopramide/i,
  "Bowel preparation": /bowel preparation|bowel prep|sodium picosulfate|polyethylene glycol|magnesium sulphate/i
};

let products = [];
let activeCategory = "All";

const $ = id => document.getElementById(id);

function textOf(p){
  return Object.values(p || {}).filter(v => v !== null && v !== undefined)
    .map(v => typeof v === "object" ? JSON.stringify(v) : String(v))
    .join(" ");
}

function categoryMatches(p, category){
  if(category === "All") return true;
  return CATEGORY_RULES[category].test(textOf(p));
}

function normalise(p){
  // Exact keys used by the supplied products.json.
  return {
    product: p.product ?? "",
    company: p.company ?? "",
    composition: p.composition ?? "",
    indication: p.indication ?? "",
    page: p.page ?? ""
  };
}

function renderFilters(){
  $("filters").innerHTML = ["All", ...Object.keys(CATEGORY_RULES)].map(c =>
    `<button class="filter ${c===activeCategory?"active":""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join("");
  document.querySelectorAll(".filter").forEach(b => b.onclick = () => {
    activeCategory = b.dataset.cat;
    renderFilters();
    render();
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const filtered = products.filter(p => {
    if(!categoryMatches(p, activeCategory)) return false;
    if(!q) return true;
    return textOf(p).toLowerCase().includes(q);
  });

  $("count").textContent = `${filtered.length} product${filtered.length===1?"":"s"} found`;

  if(!filtered.length){
    $("results").innerHTML = `<div class="empty">No matching products found.</div>`;
    return;
  }

  $("results").innerHTML = filtered.map(raw => {
    const p = normalise(raw);
    return `<article class="card">
      <div class="brand">${escapeHtml(p.product || "Unnamed product")}</div>
      <div class="company">${escapeHtml(p.company || "")}</div>
      <div class="label">Composition / Strength:</div>
      <div class="value">${escapeHtml(p.composition || "Not specified")}</div>
      <div class="label">Indication:</div>
      <div class="value">${escapeHtml(p.indication || "Not specified")}</div>
      ${p.page !== "" ? `<div class="page">Source page: ${escapeHtml(p.page)}</div>` : ""}
    </article>`;
  }).join("");
}

async function loadProducts(){
  try{
    const response = await fetch("./products.json?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if(!Array.isArray(data)) throw new Error("products.json is not an array");
    products = data;
    renderFilters();
    render();
  }catch(err){
    $("count").textContent = "Unable to load products";
    $("results").innerHTML = `<div class="error"><strong>Database loading error.</strong><br>${escapeHtml(err.message)}</div>`;
  }
}

$("search").addEventListener("input", render);
renderFilters();
loadProducts();
</script>
</body>
</html>
