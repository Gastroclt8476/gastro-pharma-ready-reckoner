<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastro Pharma">
<link rel="manifest" href="./manifest.webmanifest">
<title>Gastro Pharma Ready Reckoner</title>
<style>
:root{--blue:#0b5cab;--bg:#f4f7fb;--card:#fff;--text:#17212b;--muted:#637080;--border:#d6e0ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}header{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.97);backdrop-filter:blur(12px);padding:14px 10px 10px;border-bottom:1px solid var(--border)}h1{font-size:21px;margin:0 0 10px;font-weight:750}.search{width:100%;font-size:17px;padding:14px 16px;border:1px solid #cbd5df;border-radius:14px;background:white;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,171,.12)}.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--border);background:white;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}.filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}main{max-width:920px;margin:auto;padding:14px 10px 40px}.count{color:var(--muted);font-size:14px;margin:4px 4px 10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.brand{font-size:20px;font-weight:800;color:#075fac;margin-bottom:5px}.company{font-size:14px;color:var(--muted);margin-bottom:10px}.label{font-weight:750;margin-top:7px}.value{margin-top:3px;line-height:1.4}.page{display:inline-block;margin-top:10px;color:var(--muted);font-size:12px}.empty{text-align:center;color:var(--muted);padding:40px 10px}.error{background:#fff1f1;border:1px solid #f0b5b5;border-radius:12px;padding:14px;color:#8a1c1c}
</style>
</head>
<body>
<header><h1>Gastro Pharma Ready Reckoner</h1><input id="search" class="search" type="search" placeholder="Search brand, generic, composition, company, indication…" autocomplete="off"><div id="filters" class="filters"></div></header>
<main><div id="count" class="count">Loading products…</div><div id="results"></div></main>
<script>
const CATEGORY_RULES={GERD:/gerd|reflux|dyspepsia|gastritis|acid|ppi|proton pump/i,IBD:/ibd|ulcerative colitis|crohn|mesalamine|mesalazine|inflammatory bowel/i,IBS:/ibs|irritable bowel|functional bowel/i,Liver:/liver|hepatic|cirrhosis|nafld|masld|hepatitis|encephalopathy/i,Pancreas:/pancreas|pancreatic|pancreatitis/i,Constipation:/constipation|laxative|stool|ispaghula|lactitol|lactulose/i,"H. pylori":/h\.?\s*pylori|helicobacter/i,Diarrhea:/diarrhea|diarrhoea|loose stool|ors|oral rehydration/i,Nutrition:/nutrition|protein|vitamin|omega|micronutrient|supplement/i,Prokinetic:/prokinetic|domperidone|levosulpiride|itopride|mosapride|metoclopramide/i,"Bowel preparation":/bowel preparation|bowel prep|sodium picosulfate|polyethylene glycol|magnesium sulphate/i};
const ESYS_ALIAS=/\b(?:esys|eysys|esys pharma|esys pharmaceutical|eysys pharmaceutical|amaris)\b/i;
const ESYS_PRODUCT_NAMES=/bilepass|eysirifa|voniq|sysraft|bowelclean|mesafilar|mesaflar|relolact|pufacto/i;
const SEARCH_ALIASES={
  hpylori:["h pylori","helicobacter"],
  helicobacter:["h pylori","hpylori"],
  ibs:["ibs","irritable bowel","functional bowel"],
  constipation:["constipation","laxative","stool"],
  diarrhea:["diarrhea","diarrhoea","loose stool"],
  diarrhoea:["diarrhea","diarrhoea","loose stool"]
};
let products=[],activeCategory="All";const $=id=>document.getElementById(id);
function textOf(p){return Object.values(p||{}).filter(v=>v!==null&&v!==undefined).map(v=>typeof v==="object"?JSON.stringify(v):String(v)).join(" ");}
function normalizeSearch(s){return String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[\u00a0]/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}
function compactSearch(s){return normalizeSearch(s).replace(/\s+/g,"");}
function searchMatches(p,q){
  if(!q)return true;
  const nq=normalizeSearch(q);
  const hay=normalizeSearch(textOf(p));
  const compactHay=compactSearch(textOf(p));
  if(/^(esys|eysys|esys pharma|esys pharmaceutical|eysys pharmaceutical|amaris)$/.test(nq)){
    return ESYS_ALIAS.test(textOf(p)) || ESYS_PRODUCT_NAMES.test(hay);
  }
  const words=nq.split(" ").filter(Boolean);
  return words.every(w=>{
    if(hay.includes(w)||compactHay.includes(compactSearch(w)))return true;
    const aliases=SEARCH_ALIASES[w]||[];
    return aliases.some(a=>hay.includes(normalizeSearch(a))||compactHay.includes(compactSearch(a)));
  });
}
function categoryMatches(p,c){return c==="All"||CATEGORY_RULES[c].test(textOf(p));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function renderFilters(){$("filters").innerHTML=["All",...Object.keys(CATEGORY_RULES)].map(c=>`<button class="filter ${c===activeCategory?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderFilters();render()});}
function render(){const q=$("search").value;const filtered=products.filter(p=>categoryMatches(p,activeCategory)&&searchMatches(p,q));$("count").textContent=`${filtered.length} product${filtered.length===1?"":"s"} found`;if(!filtered.length){$("results").innerHTML='<div class="empty">No matching products found.</div>';return}$("results").innerHTML=filtered.map(p=>`<article class="card"><div class="brand">${esc(p.product||"Unnamed product")}</div><div class="company">${esc(p.company||"")}</div><div class="label">Composition / Strength:</div><div class="value">${esc(p.composition||"Not specified")}</div><div class="label">Indication:</div><div class="value">${esc(p.indication||"Not specified")}</div>${p.page!==undefined&&p.page!==""?`<div class="page">Source page: ${esc(p.page)}</div>`:""}</article>`).join("");}
async function loadProducts(){try{const [r1,r2]=await Promise.all([fetch("./products.json?ts="+Date.now(),{cache:"no-store"}),fetch("./additional-products.json?ts="+Date.now(),{cache:"no-store"})]);if(!r1.ok)throw new Error("products.json HTTP "+r1.status);if(!r2.ok)throw new Error("additional-products.json HTTP "+r2.status);const [data1,data2]=await Promise.all([r1.json(),r2.json()]);if(!Array.isArray(data1)||!Array.isArray(data2))throw new Error("Product database is not an array");const combined=[...data1,...data2];const seen=new Set();products=combined.filter(p=>{const key=normalizeSearch((p.company||"")+"|"+(p.product||""));if(seen.has(key))return false;seen.add(key);return true});renderFilters();render()}catch(e){$("count").textContent="Unable to load products";$("results").innerHTML=`<div class="error"><strong>Database loading error.</strong><br>${esc(e.message)}</div>`}}
$("search").addEventListener("input",render);renderFilters();loadProducts();
</script>
</body></html>
