<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastro Pharma">
<link rel="manifest" href="./manifest.webmanifest">
<title>Gastro Pharma Ready Reckoner</title>
<style>
:root{--blue:#0b5cab;--bg:#f4f7fb;--card:#fff;--text:#17212b;--muted:#637080;--border:#dce3ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.96);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--border)}
h1{font-size:21px;margin:0 0 10px}
.search{width:100%;font-size:17px;padding:14px 16px;border:1px solid #cbd5df;border-radius:14px;background:white;outline:none}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,171,.12)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--border);background:white;border-radius:999px;padding:8px 11px;font-size:13px}
.filter.active{background:var(--blue);border-color:var(--blue);color:white}
main{max-width:850px;margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.status{color:var(--muted);font-size:13px;margin:4px 3px 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:14px;margin:9px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.brand{font-size:18px;font-weight:700;color:var(--blue)}
.company{font-size:13px;color:var(--muted);margin-top:3px}
.row{margin-top:9px;font-size:14px;line-height:1.42}
.label{font-weight:700}
.empty{padding:35px 15px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
</style>
</head>
<body>
<header>
<h1>Gastro Pharma Ready Reckoner</h1>
<input id="search" class="search" autocomplete="off" autocapitalize="none" spellcheck="false"
placeholder="Search brand, generic, company, indication…">
<div id="filters" class="filters"></div>
</header>
<main>
<div id="status" class="status"></div>
<div id="results"></div>
<footer>Offline-ready • Source: supplied Gastro Pharma Ready Reckoner</footer>
</main>
<script>
let products=[], active="";
const categories=["All","GERD","IBD","IBS","Liver","Pancreas","Constipation","H. pylori","Diarrhea","Nutrition","Prokinetic","Bowel preparation"];
const searchEl=document.getElementById("search"), results=document.getElementById("results"), status=document.getElementById("status"), filters=document.getElementById("filters");
function val(o, keys){for(const k of keys){if(o[k]!=null&&String(o[k]).trim())return String(o[k]).trim()}return ""}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function makeFilters(){
 filters.innerHTML="";
 categories.forEach(c=>{
  const b=document.createElement("button"); b.className="filter"+(c==="All"?" active":""); b.textContent=c;
  b.onclick=()=>{active=c==="All"?"":c; [...filters.children].forEach(x=>x.classList.remove("active")); b.classList.add("active"); render()};
  filters.appendChild(b);
 });
}
function render(){
 const q=norm(searchEl.value);
 let list=products.filter(p=>{
  const brand=val(p,["Product Name","Product","Brand","brand"]);
  const company=val(p,["Company / Division","Company","company"]);
  const comp=val(p,["Composition / Strength","Composition","Generic","generic"]);
  const ind=val(p,["Category / Indication","Category","Indication","indication"]);
  const hay=norm([brand,company,comp,ind].join(" "));
  return (!q||hay.includes(q)) && (!active||norm(ind).includes(norm(active)));
 });
 list.sort((a,b)=>val(a,["Product Name","Product","Brand","brand"]).localeCompare(val(b,["Product Name","Product","Brand","brand"])));
 status.textContent=list.length+" product"+(list.length===1?"":"s")+" found";
 results.innerHTML="";
 if(!list.length){results.innerHTML='<div class="empty">No matching products found.</div>';return}
 const frag=document.createDocumentFragment();
 list.forEach(p=>{
  const brand=val(p,["Product Name","Product","Brand","brand"])||"Unnamed product";
  const company=val(p,["Company / Division","Company","company"]);
  const comp=val(p,["Composition / Strength","Composition","Generic","generic"]);
  const ind=val(p,["Category / Indication","Category","Indication","indication"]);
  const card=document.createElement("article"); card.className="card";
  card.innerHTML=`<div class="brand"></div><div class="company"></div>
  <div class="row"><span class="label">Composition / Strength:</span> <span class="comp"></span></div>
  <div class="row"><span class="label">Indication:</span> <span class="ind"></span></div>`;
  card.querySelector(".brand").textContent=brand; card.querySelector(".company").textContent=company;
  card.querySelector(".comp").textContent=comp; card.querySelector(".ind").textContent=ind;
  frag.appendChild(card);
 });
 results.appendChild(frag);
}
fetch("./products.json").then(r=>r.json()).then(d=>{
 products=Array.isArray(d)?d:(d.products||d.data||d.items||[]);
 makeFilters(); render();
 if("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
}).catch(()=>{status.textContent="Could not load database";results.innerHTML='<div class="empty">Please reopen the app from its hosted web address.</div>'});
searchEl.addEventListener("input",render);
</script>
</body>
</html>
