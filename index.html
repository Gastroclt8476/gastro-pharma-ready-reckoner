<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastro Pharma">
<link rel="manifest" href="./manifest.webmanifest">
<title>Gastro Pharma Ready Reckoner</title>
<style>
:root{--blue:#0b5cab;--bg:#f3f6fa;--card:#fff;--text:#15202b;--muted:#617080;--border:#d9e1e9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(243,246,250,.97);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--border)}
h1{font-size:21px;line-height:1.2;margin:0 0 10px;font-weight:750}
.search{width:100%;font-size:17px;padding:14px 16px;border:1px solid #c7d2de;border-radius:14px;background:#fff;outline:none}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,171,.12)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 11px;font-size:13px;color:var(--text)}
.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:900px;margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.status{color:var(--muted);font-size:13px;margin:4px 3px 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px 16px;margin:9px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.brand{font-size:19px;font-weight:750;color:var(--blue);line-height:1.25}
.company{font-size:14px;font-weight:600;color:#394856;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr;gap:7px;margin-top:11px}
.row{font-size:14px;line-height:1.45}
.label{font-weight:700;color:#1b2732}
.value{color:#263540}
.source{font-size:12px;color:var(--muted);margin-top:10px}
.empty{padding:35px 15px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:12px}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}.search{font-size:18px}}
</style>
</head>
<body>
<header>
<h1>Gastro Pharma Ready Reckoner</h1>
<input id="search" class="search" autocomplete="off" autocapitalize="none" spellcheck="false"
placeholder="Search brand, generic, company, indication…">
<div id="filters" class="filters"></div>
</header>
<main>
<div id="status" class="status">Loading products…</div>
<div id="results"></div>
<footer>180 products • Offline-ready • Based on supplied pharma material</footer>
</main>
<script>
let products=[], active="";
const categories=["All","GERD","IBD","IBS","Liver","Pancreas","Constipation","H. pylori","Diarrhea","Nutrition","Prokinetic","Bowel preparation"];
const $=id=>document.getElementById(id);
const fields=p=>({brand:p.product||"",company:p.company||"",composition:p.composition||"",indication:p.indication||"",page:p.page||""});
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function makeFilters(){
 categories.forEach(c=>{
  const b=document.createElement("button"); b.type="button"; b.className="filter"+(c==="All"?" active":""); b.textContent=c;
  b.onclick=()=>{active=c==="All"?"":c; [...$("filters").children].forEach(x=>x.classList.remove("active")); b.classList.add("active"); render()};
  $("filters").appendChild(b);
 });
}
function render(){
 const q=norm($("search").value);
 let list=products.filter(p=>{
  const f=fields(p), hay=norm([f.brand,f.company,f.composition,f.indication].join(" "));
  return (!q||hay.includes(q)) && (!active||hay.includes(norm(active)));
 });
 list.sort((a,b)=>norm(a.product).localeCompare(norm(b.product)));
 $("status").textContent=list.length+" product"+(list.length===1?"":"s")+" found";
 $("results").innerHTML="";
 if(!list.length){$("results").innerHTML='<div class="empty">No matching products found.</div>';return}
 const frag=document.createDocumentFragment();
 list.forEach(p=>{
  const f=fields(p), card=document.createElement("article"); card.className="card";
  card.innerHTML='<div class="brand"></div><div class="company"></div><div class="grid">'+
    '<div class="row"><span class="label">Composition / Strength:</span><br><span class="value comp"></span></div>'+
    '<div class="row"><span class="label">Indication / Category:</span><br><span class="value ind"></span></div>'+
    '</div><div class="source"></div>';
  card.querySelector(".brand").textContent=f.brand||"Unnamed product";
  card.querySelector(".company").textContent=f.company||"Company not specified";
  card.querySelector(".comp").textContent=f.composition||"Not specified in source";
  card.querySelector(".ind").textContent=f.indication||"Not specified in source";
  card.querySelector(".source").textContent=f.page?"Source page: "+f.page:"";
  frag.appendChild(card);
 });
 $("results").appendChild(frag);
}
fetch("./products.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("database");return r.json()}).then(d=>{
 products=Array.isArray(d)?d:(d.products||d.data||d.items||[]);
 makeFilters(); render();
 if("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
}).catch(e=>{
 $("status").textContent="Database could not be loaded";
 $("results").innerHTML='<div class="empty">Please check the hosted app and reload the page.</div>';
});
$("search").addEventListener("input",render);
</script>
</body>
</html>
