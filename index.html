<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastro Pharma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<title>Gastro Pharma Ready Reckoner</title>
<style>
:root{--blue:#0b5cab;--bg:#f4f7fb;--card:#fff;--text:#17212b;--muted:#637080;--border:#d7e0ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(244,247,251,.97);padding:14px 16px 10px;border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
h1{font-size:21px;margin:0 0 10px}
.search{width:100%;font-size:17px;padding:14px 16px;border:1px solid #cbd5df;border-radius:14px;background:#fff;outline:none}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,92,171,.12)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}
.filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:920px;margin:0 auto;padding:16px}
.status{color:var(--muted);font-size:14px;margin:3px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:0 0 11px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.name{font-size:20px;font-weight:750;color:#075cae;margin-bottom:6px}
.company{font-size:14px;color:var(--muted);margin-bottom:12px}
.label{font-weight:700;margin-top:8px}
.value{margin-top:3px;line-height:1.4}
.empty{padding:30px 8px;text-align:center;color:var(--muted)}
.small{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Gastro Pharma Ready Reckoner</h1>
  <input id="search" class="search" type="search" placeholder="Search brand, generic, company, indication…" autocomplete="off" spellcheck="false">
  <div id="filters" class="filters"></div>
</header>
<main>
  <div id="status" class="status">Loading products…</div>
  <div id="list"></div>
</main>

<script>
(function(){
"use strict";

const SEARCH_KEYS = [
  "name","product","product_name","productName","brand","brand_name","brandName",
  "trade_name","tradeName","medicine","medicine_name","title","generic","generic_name",
  "genericName","composition","composition_strength","compositionStrength","strength",
  "company","manufacturer","manufacturer_name","company_name","indication","indications",
  "category","categories","therapeutic_category","therapeuticCategory","source","source_page"
];

function str(v){
  if(v===null || v===undefined) return "";
  if(Array.isArray(v)) return v.map(str).filter(Boolean).join(" ");
  if(typeof v==="object") return Object.values(v).map(str).filter(Boolean).join(" ");
  return String(v);
}

function first(o, keys){
  for(const k of keys){
    if(o && Object.prototype.hasOwnProperty.call(o,k)){
      const s=str(o[k]).trim();
      if(s) return s;
    }
  }
  return "";
}

function deepFind(o, wanted){
  if(!o || typeof o!=="object") return "";
  const wantedLower = wanted.map(x=>x.toLowerCase());
  for(const [k,v] of Object.entries(o)){
    if(wantedLower.includes(k.toLowerCase())){
      const s=str(v).trim();
      if(s) return s;
    }
  }
  for(const v of Object.values(o)){
    if(v && typeof v==="object"){
      const s=deepFind(v,wanted);
      if(s) return s;
    }
  }
  return "";
}

function normalize(raw){
  const o = (raw && typeof raw==="object") ? raw : {};
  const name = first(o,["name","product","product_name","productName","brand","brand_name","brandName","trade_name","tradeName","medicine","medicine_name","title"])
            || deepFind(o,["name","product","product_name","brand","brand_name","trade_name","medicine","title"])
            || "Unnamed product";
  const company = first(o,["company","manufacturer","manufacturer_name","company_name","marketer","firm"])
               || deepFind(o,["company","manufacturer","manufacturer_name","company_name","marketer","firm"]);
  const composition = first(o,["composition","composition_strength","compositionStrength","strength","generic","generic_name","genericName","salt","ingredients"])
                    || deepFind(o,["composition","composition_strength","strength","generic","generic_name","salt","ingredients"]);
  const indication = first(o,["indication","indications","category","categories","therapeutic_category","therapeuticCategory","use","uses"])
                   || deepFind(o,["indication","indications","category","therapeutic_category","use","uses"]);
  const source = first(o,["source","source_page","sourcePage","page","reference","ref"]);
  const allText = Object.values(o).map(str).join(" ");
  return {raw:o,name,company,composition,indication,source,allText};
}

function unwrap(data){
  if(Array.isArray(data)) return data;
  if(data && typeof data==="object"){
    for(const k of ["products","data","items","medicines","results","records"]){
      if(Array.isArray(data[k])) return data[k];
    }
    // If the object itself looks like a single product, return it as one record.
    return [data];
  }
  return [];
}

let products=[];
let active="All";
let query="";

const categoryOrder=["All","GERD","IBD","IBS","Liver","Pancreas","Constipation","H. pylori","Diarrhea","Nutrition","Prokinetic","Bowel preparation"];

const searchEl=document.getElementById("search");
const filtersEl=document.getElementById("filters");
const listEl=document.getElementById("list");
const statusEl=document.getElementById("status");

function renderFilters(){
  filtersEl.innerHTML="";
  const cats=new Set(categoryOrder);
  products.forEach(p=>{
    const s=p.indication||"";
    // Keep the predefined clinical categories; add any other useful categories found in the data.
    categoryOrder.forEach(c=>{ if(s.toLowerCase().includes(c.toLowerCase())) cats.add(c); });
  });
  categoryOrder.forEach(c=>{
    const b=document.createElement("button");
    b.className="filter"+(active===c?" active":"");
    b.textContent=c;
    b.onclick=()=>{active=c;renderFilters();render();};
    filtersEl.appendChild(b);
  });
}

function matches(p){
  const q=query.trim().toLowerCase();
  const cat=active.toLowerCase();
  const catOK=active==="All" || (p.indication||"").toLowerCase().includes(cat);
  if(!catOK) return false;
  if(!q) return true;
  return (p.allText||"").toLowerCase().includes(q) ||
         p.name.toLowerCase().includes(q) ||
         p.company.toLowerCase().includes(q) ||
         p.composition.toLowerCase().includes(q) ||
         p.indication.toLowerCase().includes(q);
}

function card(p){
  const d=document.createElement("article");
  d.className="card";
  const name=document.createElement("div"); name.className="name"; name.textContent=p.name;
  d.appendChild(name);
  if(p.company){const x=document.createElement("div");x.className="company";x.textContent=p.company;d.appendChild(x);}
  const l1=document.createElement("div");l1.className="label";l1.textContent="Composition / Strength:";d.appendChild(l1);
  const v1=document.createElement("div");v1.className="value";v1.textContent=p.composition||"—";d.appendChild(v1);
  const l2=document.createElement("div");l2.className="label";l2.textContent="Indication:";d.appendChild(l2);
  const v2=document.createElement("div");v2.className="value";v2.textContent=p.indication||"—";d.appendChild(v2);
  if(p.source){const s=document.createElement("div");s.className="small";s.textContent="Source: "+p.source;d.appendChild(s);}
  return d;
}

function render(){
  const filtered=products.filter(matches);
  statusEl.textContent=filtered.length+" product"+(filtered.length===1?"":"s")+" found";
  listEl.innerHTML="";
  if(!filtered.length){
    const e=document.createElement("div");e.className="empty";e.textContent="No matching products found.";listEl.appendChild(e);return;
  }
  filtered.forEach(p=>listEl.appendChild(card(p)));
}

searchEl.addEventListener("input",()=>{query=searchEl.value;render();});

fetch("./products.json",{cache:"no-store"})
  .then(r=>{if(!r.ok) throw new Error("Could not load products.json ("+r.status+")");return r.json();})
  .then(data=>{
    products=unwrap(data).map(normalize);
    statusEl.textContent=products.length+" products loaded";
    renderFilters();
    render();
  })
  .catch(err=>{
    console.error(err);
    statusEl.textContent="Unable to load product database";
    listEl.innerHTML='<div class="empty">The product database could not be loaded. Please refresh the page.</div>';
  });
})();
</script>
</body>
</html>
